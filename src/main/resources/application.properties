# Application
spring.application.name=expense-tracker
server.port=8080

# Database Configuration (H2 File-based - данные сохраняются)
spring.datasource.url=jdbc:h2:file:./data/expensetracker
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=false

# JWT Configuration
jwt.secret=MySecretKeyForJWTTokenGenerationExpenseTrackerApp2026SecureKey123
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Logging
logging.level.com.expensetracker=DEBUG
logging.level.org.springframework.security=DEBUG

# OpenAPI/Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Thymeleaf
spring.thymeleaf.cache=false

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
